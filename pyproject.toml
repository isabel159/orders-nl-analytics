[project]
name = "orders-app"
version = "0.1.0"
description = "Pipeline de pedidos (limpieza + PostgreSQL) y API FastAPI de preguntas en lenguaje natural a SQL con Azure OpenAI."
readme = "README.md"
authors = [
    { name = "Isabel Igarza" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.56.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.33.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
